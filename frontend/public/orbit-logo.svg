<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20A66A"/>
      <stop offset="100%" stop-color="#087443"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20A66A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D2A0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Orbit Ellipse -->
  <ellipse cx="50" cy="50" rx="42" ry="24" transform="rotate(-25 50 50)" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
  
  <!-- Inner Orbit Ellipse -->
  <ellipse cx="50" cy="50" rx="34" ry="18" transform="rotate(35 50 50)" stroke="#20A66A" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  
  <!-- Central Core Planet / Node -->
  <circle cx="50" cy="50" r="14" fill="url(#orbitGrad)" filter="url(#glow)"/>
  
  <!-- Inner Core Ring -->
  <circle cx="50" cy="50" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="50" cy="50" r="4.5" fill="#087443"/>

  <!-- Orbiting Satellites -->
  <circle cx="82" cy="38" r="4.5" fill="#20A66A" filter="url(#glow)"/>
  <circle cx="82" cy="38" r="2" fill="#FFFFFF"/>

  <circle cx="20" cy="62" r="3.5" fill="#00D2A0"/>
  <circle cx="68" cy="72" r="3" fill="#20A66A"/>
</svg>
